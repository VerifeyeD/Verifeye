<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerifEye | Spot The Fake Arcade</title>
    
    <link rel="stylesheet" href="../css/selfassessment.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <header>
        <nav>
            <a href="../pages/homepage.html" class="logo" style="text-decoration: none; color: inherit; cursor: pointer;">
                <img src="../assets/images/logo.png" alt="VerifEye">
                <h2><div class="logoname">VerifEye</div></h2> 
            </a>
            <ul>
                <li><a href="../pages/homepage.html">Home</a></li>
                <li><a href="../pages/article.html">Article</a></li>
                <li><a href="../pages/glossary.html">Glossary</a></li>
                <li><a href="../pages/selfassessment.html" class="active">Self-assessment</a></li>
                <li><a href="../pages/Discussions.html">Discussions</a></li>
            </ul>
            
            <div id="auth-status"></div>
        </nav>
    </header>
    <hr class="header-line">

    <main>
        <div class="arcade-wrapper">
            <div class="arcade-header">
                <h1>Spot The Fake</h1>
                <p>Test your intuition. Can you identify which images are real and which are AI-generated?</p>
                <div class="score-board">
                    Score: <span id="current-score" style="color: #06629b;">0</span> / <span id="total-rounds">0</span>
                </div>
            </div>

            <div class="game-container" id="game-container">
                <div class="image-stage" id="image-stage">
                    <img id="game-image" src="" alt="Is this real or fake?">
                    <div id="hotspots-container"></div>
                </div>

                <div class="controls-area" id="controls-area">
                    <h3 style="margin-bottom: 20px; font-weight: 600;">What do you think?</h3>
                    <div class="button-group">
                        <button class="btn-guess real" onclick="makeGuess(false)">
                            <i class='bx bx-check-circle'></i> It's Real
                        </button>
                        <button class="btn-guess ai" onclick="makeGuess(true)">
                            <i class='bx bx-bot'></i> It's AI Generated
                        </button>
                    </div>
                </div>

                <div class="feedback-panel" id="feedback-panel" style="display: none;">
                    <div class="feedback-header">
                        <div id="feedback-icon" class="feedback-icon"></div>
                        <h2 id="feedback-title"></h2>
                    </div>
                    <p id="feedback-explanation" class="feedback-text"></p>
                    <button class="btn-next" id="btn-next" onclick="nextRound()">Next Image ➔</button>
                </div>
            </div>
            
            <div class="end-screen" id="end-screen" style="display: none;">
                <h2>Assessment Complete!</h2>
                <div class="final-score" id="final-score"></div>
                <p id="final-message"></p>
                <button class="btn-restart" onclick="initGame()">Play Again</button>
            </div>

        </div>
    </main>

    <div id="custom-alert-overlay" class="custom-alert-overlay">
        <div class="custom-alert-box" id="custom-alert-box">
            <div class="custom-alert-icon" id="custom-alert-icon"></div>
            <h2 class="custom-alert-title" id="custom-alert-title"></h2>
            <p class="custom-alert-message" id="custom-alert-message"></p>
            <button class="custom-alert-btn" onclick="closeCustomAlert()">OK</button>
        </div>
    </div>

    <script src="../js/profile.js"></script>
    <script src="../js/selfassessment.js"></script>
</body>
</html>
